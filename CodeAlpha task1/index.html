<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculator</title>
<link rel="stylesheet" href="style.css"></head><body>
<div class="calc">
  <div class="screen"><div id="expr"></div><div id="cur">0</div></div>
  <div class="keys">
    <button class="fn" data-a="clear">AC</button><button class="fn" data-a="del">⌫</button>
    <button class="fn" data-a="percent">%</button><button class="op" data-o="÷">÷</button>
    <button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button><button class="op" data-o="×">×</button>
    <button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button><button class="op" data-o="−">−</button>
    <button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button class="op" data-o="+">+</button>
    <button data-n="0">0</button><button data-n=".">.</button><button class="eq" data-a="eq">=</button>
  </div>
</div>
<script src="script.js"></script></body></html>

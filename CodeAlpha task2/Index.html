<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Gallery</title>
<link rel="stylesheet" href="style.css"></head><body>
<h1>Image Gallery</h1>
<div class="filters">
  <button class="active" data-f="all">All</button>
  <button data-f="nature">Nature</button>
  <button data-f="city">City</button>
  <button data-f="animals">Animals</button>
</div>
<div class="grid" id="grid"></div>
<div id="lb"><button id="close" aria-label="Close">&times;</button><button id="prev" aria-label="Previous">&#8249;</button>
<img id="lbimg" alt=""><button id="next" aria-label="Next">&#8250;</button><div id="cap"></div></div>
<script src="script.js"></script></body></html>
